[project]
name = "rsna-knee-labels"
version = "0.1.0"
description = "Weak-label extraction and local evaluation utilities for the RSNA Knee Abnormality Detection competition"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
llm = ["vllm==0.6.6", "transformers"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rsna_knee_labels*"]
